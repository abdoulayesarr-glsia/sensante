<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SenSante - Pré-diagnostic</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white py-4 shadow-lg">
    <div class="max-w-4xl mx-auto px-4">
      <h1 class="text-2xl font-bold">SenSante</h1>
      <p class="text-blue-100 text-sm">Assistant pré-diagnostic médical</p>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-4xl mx-auto px-4 py-8">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- FORM -->
      <div id="form-section" class="bg-white rounded-xl shadow-md p-6">

        <h2 class="text-xl font-bold mb-4">Symptômes du patient</h2>

        <!-- AGE -->
        <input id="age" type="number" placeholder="Âge"
          class="w-full mb-3 border p-2 rounded" />

        <!-- SEXE -->
        <select id="sexe" class="w-full mb-3 border p-2 rounded">
          <option value="F">Féminin</option>
          <option value="M">Masculin</option>
        </select>

        <!-- TEMP -->
        <input id="temperature" type="number" step="0.1"
          placeholder="Température"
          class="w-full mb-3 border p-2 rounded" />

        <!-- TENSION -->
        <input id="tension_sys" type="number"
          placeholder="Tension systolique"
          class="w-full mb-3 border p-2 rounded" />

        <!-- SYMPTOMES -->
        <label><input type="checkbox" id="toux"> Toux</label><br>
        <label><input type="checkbox" id="fatigue"> Fatigue</label><br>
        <label><input type="checkbox" id="maux_tete"> Maux de tête</label><br><br>

        <!-- REGION -->
        <select id="region" class="w-full mb-4 border p-2 rounded">
          <option>Dakar</option>
          <option>Thies</option>
          <option>Saint-Louis</option>
          <option>Ziguinchor</option>
        </select>

        <button onclick="diagnostiquer()"
          class="w-full bg-blue-600 text-white py-3 rounded">
          Diagnostiquer
        </button>

      </div>

      <!-- RESULT -->
      <div id="result-section">

        <div class="bg-white rounded-xl shadow-md p-6 text-gray-400 text-center">
          🩺 Remplissez le formulaire
        </div>

      </div>

    </div>
  </main>

  <!-- SCRIPT -->
  <script>

    const API_URL = "http://localhost:8000";

    // =========================
    // DIAGNOSTIC
    // =========================
    async function diagnostiquer() {

      const patient = {
        age: parseInt(document.getElementById("age").value),
        sexe: document.getElementById("sexe").value,
        temperature: parseFloat(document.getElementById("temperature").value),
        tension_sys: parseInt(document.getElementById("tension_sys").value),
        toux: document.getElementById("toux").checked,
        fatigue: document.getElementById("fatigue").checked,
        maux_tete: document.getElementById("maux_tete").checked,
        region: document.getElementById("region").value
      };

      afficherChargement();

      try {

        const response = await fetch(API_URL + "/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(patient)
        });

        const resultat = await response.json();
        afficherResultat(resultat);

      } catch (err) {
        afficherErreur(err.message);
      }
    }

    // =========================
    // LOADING
    // =========================
    function afficherChargement() {
      document.getElementById("result-section").innerHTML = `
        <div class="bg-white p-6 text-center">
          ⏳ Analyse en cours...
        </div>
      `;
    }

    // =========================
    // RESULTAT
    // =========================
    function afficherResultat(r) {

      const section = document.getElementById("result-section");

      let textColor = "";
      let barColor = "";

      if (r.confiance === "haute") {
        textColor = "text-red-600";
        barColor = "bg-red-500";
      } else if (r.confiance === "moyenne") {
        textColor = "text-yellow-600";
        barColor = "bg-yellow-500";
      } else {
        textColor = "text-green-600";
        barColor = "bg-green-500";
      }

      const percent = Math.round(r.probabilite * 100);

      section.innerHTML = `
        <div class="bg-white p-6 rounded-xl shadow-md">

          <h2 class="text-xl font-bold mb-4">Résultat</h2>

          <p class="${textColor} text-2xl font-bold">
            ${r.diagnostic}
          </p>

          <p class="mt-2">Probabilité : ${percent}%</p>

          <div class="w-full bg-gray-200 h-3 rounded mt-2">
            <div class="${barColor} h-3 rounded"
              style="width:${percent}%"></div>
          </div>

          <p class="mt-2 font-medium">
            Confiance : ${r.confiance}
          </p>

          <p class="mt-2 text-gray-600">
            ${r.message}
          </p>

        </div>
      `;

      demanderExplication(r);
    }

    // =========================
    // EXPLICATION IA
    // =========================
    async function demanderExplication(data) {

      const explainData = {
        diagnostic: data.diagnostic,
        probabilite: data.probabilite,
        age: parseInt(document.getElementById("age").value),
        sexe: document.getElementById("sexe").value,
        temperature: parseFloat(document.getElementById("temperature").value),
        region: document.getElementById("region").value
      };

      const section = document.getElementById("result-section");
      const card = section.firstElementChild;

      const div = document.createElement("div");

      div.innerHTML = `
        <div class="mt-4 p-4 bg-purple-50 rounded">
          ⏳ Explication IA...
        </div>
      `;

      card.appendChild(div);

      try {

        const response = await fetch(API_URL + "/explain", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(explainData)
        });

        if (!response.ok) throw new Error("API error");

        const result = await response.json();

        div.innerHTML = `
          <div class="mt-4 p-4 bg-purple-50 rounded">
            <p>${result.explication}</p>
          </div>
        `;

      } catch (err) {
        div.innerHTML = `<p>Erreur explication</p>`;
      }
    }

    // =========================
    // ERREUR
    // =========================
    function afficherErreur(msg) {
      document.getElementById("result-section").innerHTML = `
        <div class="bg-red-100 p-4 text-red-700">
          ${msg}
        </div>
      `;
    }

  </script>

</body>

</html>
